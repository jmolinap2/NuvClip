name: nuvclip
description: "NuvClip — descarga videos publicos de TikTok, Instagram, Facebook y YouTube, sin anuncios ni suscripciones."
publish_to: 'none'

version: 1.0.1+6

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Estado y navegacion
  flutter_riverpod: ^2.6.1
  go_router: ^17.3.0

  # Persistencia local del historial
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  shared_preferences: ^2.5.3

  # Permisos, abrir/compartir los archivos ya guardados
  permission_handler: ^12.0.3
  share_plus: ^12.0.0
  url_launcher: ^6.3.2

  # Utilidades
  intl: ^0.20.3
  collection: ^1.19.1
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.5

flutter:
  uses-material-design: true

  # Space Grotesk es la misma tipografia de marca que el resto de las apps
  # locales del usuario (NuvTune). Se empaqueta en vez de descargarla porque
  # el flujo de descarga debe funcionar aunque la app arranque sin red.
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
